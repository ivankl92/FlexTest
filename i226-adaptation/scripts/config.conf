# config.conf - TSN-FlexTest I226 adaptation, topology and run parameters.
# Sourced by run_measurement.sh. Edit to match your testbed.

# --- nodes -----------------------------------------------------------------
# PC1 = talker (this machine, where run_measurement.sh executes)
# PC2 = listener
PC2_USER="ivank"
PC2_MGMT="172.16.28.17"          # management address used for ssh

PC1_STREAM_IF="enp1s0"            # -> KSwitch 1 port 1   (measured stream)
PC1_BG_IF="enp2s0"                # -> KSwitch 1 port 2   (background load)
PC2_STREAM_IF="enp1s0"            # -> KSwitch 2 port 1
PC2_BG_IF="enp2s0"                # -> KSwitch 2 port 2

PC1_BG_IP="192.168.1.62"
PC2_BG_IP="192.168.1.72"

# --- measured stream -------------------------------------------------------
STREAM_RATE=10000                 # frames per second (100 us period).
                                  # Validated on this hardware: tx_rate_selftest.sh
                                  # returned 100% hardware TX timestamp yield up to
                                  # 20000 fps on kernel 6.8.1-realtime / igc.
                                  # Re-run that test if the kernel or NIC changes.
STREAM_SIZE=512                   # bytes on the wire, incl. Ethernet header
STREAM_DURATION=30                # seconds per measurement point
STREAM_PCP_LOW=0                  # PCP used for the No-QoS baseline
STREAM_PCP_HIGH=6                 # PCP used for the IEEE 802.1p run
STREAM_VID=0                      # 0 = priority-tagged frame (no VLAN membership)
STREAM_SOCKPRIO=3                 # SO_PRIORITY -> mqprio traffic class

# --- background load -------------------------------------------------------
# Percentages of the link rate of the background port. The background traffic
# and the measured stream share the single inter-switch link, so this is what
# creates congestion at the KSwitch egress queue.
BG_LOADS="0 50 80 95 105"
BG_STREAMS=4                      # parallel iperf3 UDP streams
BG_DGRAM=1400                     # UDP payload bytes

# --- QoS configurations to compare ----------------------------------------
QOS_MODES="none dot1p"

# --- output ----------------------------------------------------------------
RESULT_ROOT="/home/ivank/tsn-testbed/i226-adaptation/results"
